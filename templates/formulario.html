<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f3f6fc}.card{border:0;border-radius:20px;box-shadow:0 10px 35px #16214b17}.btn{border-radius:10px}</style>
</head><body><main class="container py-5" style="max-width:650px">
<a class="text-decoration-none" href="{{ url_for('inicio') }}">← Volver al listado</a>
<div class="card mt-3 p-4 p-md-5"><div class="text-primary small fw-semibold mb-2">FORMULARIO CRUD</div><h1 class="h3 fw-bold mb-4">{{ titulo }}</h1>
{% with mensajes = get_flashed_messages(with_categories=true) %}{% for categoria, mensaje in mensajes %}<div class="alert alert-{{ categoria }}">{{ mensaje }}</div>{% endfor %}{% endwith %}
<form method="post">
  <div class="mb-3"><label class="form-label fw-semibold" for="nombre">Nombre</label><input id="nombre" name="nombre" class="form-control form-control-lg" maxlength="100" required value="{{ estudiante.nombre if estudiante else '' }}" placeholder="Ej. Ana Pérez"></div>
  <div class="mb-3"><label class="form-label fw-semibold" for="correo">Correo</label><input id="correo" type="email" name="correo" class="form-control form-control-lg" maxlength="150" required value="{{ estudiante.correo if estudiante else '' }}" placeholder="Ej. ana@ejemplo.cl"></div>
  <div class="mb-4"><label class="form-label fw-semibold" for="carrera">Carrera</label><input id="carrera" name="carrera" class="form-control form-control-lg" maxlength="100" required value="{{ estudiante.carrera if estudiante else '' }}" placeholder="Ej. Ingeniería"></div>
  <button class="btn btn-primary btn-lg w-100" type="submit">Guardar estudiante</button>
</form></div></main></body></html>
